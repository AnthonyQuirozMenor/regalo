<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Universo 3D de Cumpleaños interactivo para el mejor amigo. Frases flotantes, partículas y pastel neón.">
    <title>¡FELIZ CUMPLEAÑOS! 🎉 3D Experience</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <!-- FontAwesome Iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Archivo CSS principal -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Contenedor WebGL para la escena Three.js -->
    <div id="webgl-container"></div>

    <!-- Interfaz de Usuario Overlay (HUD Directo) -->
    <div id="ui-hud" class="ui-hud">
        <!-- Control de Música Flotante -->
        <div class="music-controller">
            <button id="btn-music-toggle" class="btn-hud-icon" aria-label="Controlar Música">
                <i class="fa-solid fa-volume-high" id="music-icon"></i>
            </button>
        </div>
    </div>

    <!-- Elemento Audio apuntando a audio/music.mp3 con Autoplay inmediato -->
    <audio id="bg-music" autoplay loop preload="auto" playsinline>
        <source src="audio/music.mp3" type="audio/mpeg">
        <source src="audio/feliz_cumple_perri.mp3" type="audio/mpeg">
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>

    <!-- Librería Three.js desde CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Script Principal 3D -->
    <script src="script.js"></script>
</body>
</html>
