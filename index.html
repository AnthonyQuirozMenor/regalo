<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Universo 3D de Cumpleaños interactivo para el mejor amigo. Frases flotantes, partículas, pastel neón y mucha celebración.">
    <title>¡FELIZ CUMPLEAÑOS, BRO! 🎉 3D Experience</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <!-- FontAwesome Iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Archivo CSS principal -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Contenedor WebGL para la escena Three.js -->
    <div id="webgl-container"></div>

    <!-- Pantalla Inicial / Intro Overlay -->
    <div id="intro-overlay" class="intro-overlay">
        <div class="intro-box">
            <div class="intro-badge">PARTY 3D UNIVERSE ⚡</div>
            <h1 class="intro-title">¡FELIZ CUMPLEAÑOS! <span class="highlight-bro">HERMANO</span></h1>
            <p class="intro-subtitle">Entrando a un espacio 3D creado especialmente para ti... 🍻</p>
            <button id="btn-start" class="btn-start-cyber">
                INGRESAR AL UNIVERSO <i class="fa-solid fa-rocket"></i>
            </button>
        </div>
    </div>

    <!-- Interfaz de Usuario Overlay (HUD) -->
    <div id="ui-hud" class="ui-hud hidden">
        <!-- Banner Superior -->
        <header class="hud-header">
            <div class="hud-title-container">
                <span class="hud-tag">BIRTHDAY EDITION 🎉</span>
                <h1 id="hud-main-title">¡FELIZ CUMPLEAÑOS, <span id="hud-friend-name">MÁQUINA</span>!</h1>
                <p id="hud-sub-title">El mejor bro de todos 🔥</p>
            </div>
        </header>

        <!-- Pista Interactiva Inferior -->
        <div class="hud-hint">
            <i class="fa-solid fa-hand-pointer"></i> Mueve la pantalla para explorar el espacio 3D • ¡Toca el pastel central para detonar la fiesta! 🎂
        </div>

        <!-- Control de Música Flotante -->
        <div class="music-controller">
            <button id="btn-music-toggle" class="btn-hud-icon" aria-label="Controlar Música">
                <i class="fa-solid fa-volume-high" id="music-icon"></i>
            </button>
        </div>
    </div>

    <!-- Elemento Audio con la canción Feliz Cumple Perri (Damas Gratis / Cumbia) -->
    <audio id="bg-music" loop preload="auto">
        <source src="audio/feliz_cumple_perri.mp3" type="audio/mpeg">
        <source src="audio/romantic_song.mp3" type="audio/mpeg">
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>

    <!-- Librería Three.js desde CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Script Principal 3D -->
    <script src="script.js"></script>
</body>
</html>
